<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f5efe2" />
    <title>TipTop Realty -- Internal Listings Desk</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800;9..144,900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-body">
    <header class="admin-header">
      <p class="admin-kicker">Internal desk</p>
      <h1>TipTop Listings Review</h1>
      <p class="admin-sub">Not for public links. <a href="index.html">View the public website &rarr;</a></p>
    </header>

    <main class="admin-main">
      <table id="admin-table" class="admin-table">
        <thead>
          <tr>
            <th scope="col">Photo</th>
            <th scope="col">Neighborhood</th>
            <th scope="col">Type</th>
            <th scope="col">Price</th>
            <th scope="col">Zillow</th>
            <th scope="col">Last synced</th>
            <th scope="col">Status</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody id="admin-listings"></tbody>
      </table>
    </main>

    <script>
      (async () => {
        const res = await fetch("listings.json");
        const { listings } = await res.json();
        const escape = (s) =>
          String(s ?? "").replace(/[&<>"']/g, (c) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          })[c]);
        const statusLabel = { current: "Current", needs_sync: "Needs sync", unknown: "Unknown" };

        document.getElementById("admin-listings").innerHTML = listings
          .map((listing) => `
            <tr data-id="${escape(listing.id)}">
              <td><img src="${escape(listing.photo)}" alt="" class="admin-thumb" /></td>
              <td>${escape(listing.neighborhood)}</td>
              <td>${escape(listing.type)}</td>
              <td>${escape(listing.price)}</td>
              <td><a href="${escape(listing.zillow_url)}" target="_blank" rel="noopener noreferrer">View &#8599;</a></td>
              <td>${listing.last_synced ? escape(listing.last_synced) : "&mdash;"}</td>
              <td><span class="status-pill status-${escape(listing.status)}">${escape(statusLabel[listing.status] ?? listing.status)}</span></td>
              <td><button class="btn-mark-synced" data-id="${escape(listing.id)}" type="button">Mark synced</button></td>
            </tr>
          `)
          .join("");

        // No-op handler in this static MVP.
        document.querySelectorAll(".btn-mark-synced").forEach((button) => {
          button.addEventListener("click", (event) => {
            const id = event.currentTarget.dataset.id;
            console.log(`[mvp-stub] Mark synced clicked for ${id}; no-op in MVP`);
            event.currentTarget.textContent = "Marked (stub)";
            event.currentTarget.disabled = true;
          });
        });
      })();
    </script>
  </body>
</html>
